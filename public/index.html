<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Importaciones Colombia — Dashboard</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #ffffff;
    --page:           #f4f6f8;
    --text-primary:   #0b1b3a;
    --text-secondary: #52616f;
    --text-muted:     #8a97a3;
    --gridline:       #e3e7eb;
    --baseline:       #c3c2b7;
    --border:         rgba(11,27,58,0.10);
    --navy:           #0b1b3a;
    --navy-2:         #13284f;
    --accent-green:   #14b881;
    --series-1: #14b881; /* green (brand accent) */
    --series-2: #0b1b3a; /* navy */
    --series-3: #2a78d6; /* blue */
    --series-4: #eda100; /* yellow */
    --series-5: #e87ba4; /* magenta */
    --series-6: #eb6834; /* orange */
    --series-7: #4a3aa7; /* violet */
    --series-8: #e34948; /* red */
  }
  /* El dashboard siempre usa el tema claro, sin importar el modo oscuro del sistema
     operativo -- no hay toggle de tema en la UI, así que dejar que respondiera a
     prefers-color-scheme solo causaba que en computadores con modo oscuro activado
     el fondo se viera negro sin forma de cambiarlo. */

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }
  header.top {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    margin: 0 calc(50% - 50vw) 24px;
    padding: 22px 20px;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff;
  }
  header.top .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    width: 100%;
    max-width: 1200px;
  }
  header.top .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header.top .logo-mark {
    height: 52px;
    width: auto;
    flex-shrink: 0;
    object-fit: contain;
  }
  header.top .titles {
    border-left: 1px solid rgba(255,255,255,0.25);
    padding-left: 16px;
  }
  header.top h1 {
    font-size: 1.5rem;
    margin: 0;
    font-weight: 700;
    color: #fff;
  }
  header.top p {
    margin: 4px 0 0;
    color: rgba(255,255,255,0.65);
    font-size: 0.85rem;
  }
  .filters {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    box-shadow: 0 1px 2px rgba(11,27,58,0.06);
  }
  .filters label {
    font-size: 0.8rem;
    color: var(--text-secondary);
  }
  .filters input[type="month"], .filters select {
    font: inherit;
    font-size: 0.85rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    background: var(--surface-1);
    color: var(--text-primary);
  }
  .filters button {
    font: inherit;
    font-size: 0.85rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    background: var(--accent-green);
    color: var(--navy);
    font-weight: 600;
    cursor: pointer;
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent-green);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 1px 2px rgba(11,27,58,0.05);
  }
  .stat-tile .label {
    font-size: 0.78rem;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .stat-tile .value {
    font-size: 1.5rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  figure.chart-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px 8px;
    margin: 0 0 20px;
  }
  figure.chart-card .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  figure.chart-card h2 {
    font-size: 1rem;
    margin: 0;
  }
  figure.chart-card .subtitle {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin: 2px 0 0;
  }
  .table-toggle {
    font-size: 0.78rem;
    color: var(--text-secondary);
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 9px;
    cursor: pointer;
  }
  .chart-wrap { position: relative; }
  .chart-wrap canvas { max-width: 100%; }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  table.data-table th, table.data-table td {
    text-align: right;
    padding: 6px 8px;
    border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums;
  }
  table.data-table th:first-child, table.data-table td:first-child {
    text-align: left;
    font-variant-numeric: normal;
  }
  table.data-table th {
    color: var(--text-secondary);
    font-weight: 500;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 860px) {
    .grid-2 { grid-template-columns: 1fr; }
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
  }
  .tabs button {
    font: inherit;
    font-size: 0.85rem;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-secondary);
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .tabs button.active {
    background: var(--navy);
    color: white;
    border-color: var(--navy);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .breadcrumb {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .breadcrumb button {
    font: inherit;
    color: var(--navy);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
  }

  .empty-state {
    text-align: center;
    padding: 30px;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .novedades-banner {
    background: #fff8e6;
    border: 1px solid #eecb7a;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 20px;
    display: none;
  }
  .novedades-banner.show { display: block; }
  .novedades-banner .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .novedades-banner .head h2 {
    font-size: 0.95rem;
    margin: 0;
    color: #6b4c00;
  }
  .novedades-banner .head h2::before {
    content: "⚠ ";
  }
  .novedades-banner button.dismiss {
    font: inherit;
    font-size: 0.78rem;
    color: #6b4c00;
    background: none;
    border: 1px solid #eecb7a;
    border-radius: 6px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .novedades-list {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .novedades-list li {
    background: #fff;
    border: 1px solid #eecb7a;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.82rem;
    color: #4a3400;
  }
  .novedades-list li .fecha {
    color: var(--text-muted);
    margin-left: 6px;
    font-size: 0.75rem;
  }
</style>
</head>
<body>
<div class="viz-root page">

  <header class="top">
    <div class="header-inner">
      <div class="brand">
        <img class="logo-mark" id="logoMark" src="/logo.png" alt="Valentech for Life" />
        <div class="titles">
          <h1>Importaciones — Colombia</h1>
          <p id="rangeLabel">Base DAATER ONLINE 2025-2026</p>
        </div>
      </div>
      <div class="filters">
        <label for="fromInput">Desde</label>
        <input type="month" id="fromInput" />
        <label for="toInput">Hasta</label>
        <input type="month" id="toInput" />
        <button id="applyFilter">Aplicar</button>
        <button id="clearFilter" style="background:none;color:var(--text-secondary)">Limpiar</button>
        <label style="display:flex;align-items:center;gap:6px;margin-left:6px" title="Filtra todo el dashboard a las moléculas marcadas como de interés en focus-molecules.json">
          <input type="checkbox" id="focusToggle" checked />
          Solo moléculas de interés
        </label>
        <label style="display:flex;align-items:center;gap:6px;margin-left:6px" title="Los registros 'Medicamento Vital No Disponible' son importaciones a nombre de un paciente individual (no comerciales) — puedes excluirlos o aislarlos del resto del dashboard">
          Vitales No Disponibles
          <select id="vitalSelect" style="font:inherit;font-size:0.85rem;border:1px solid var(--border);border-radius:6px;padding:4px 6px;background:var(--surface-1);color:var(--text-primary)">
            <option value="all" selected>Todos</option>
            <option value="exclude">Excluir</option>
            <option value="only">Solo estos</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <div class="novedades-banner" id="novedadesBanner">
    <div class="head">
      <h2>Novedades: moléculas nuevas detectadas</h2>
      <button class="dismiss" id="novedadesDismiss">Ocultar</button>
    </div>
    <ul class="novedades-list" id="novedadesList"></ul>
  </div>

  <div class="stat-row" id="statRow"></div>

  <figure class="chart-card">
    <div class="card-head">
      <div>
        <h2 id="moleculaTitle">Importaciones por molécula (principio activo)</h2>
        <p class="subtitle" id="moleculaSubtitle">Top 25 por valor FOB. Click en una barra para ver el desglose por marca.</p>
      </div>
      <button class="table-toggle" data-toggle="molecula">Ver tabla</button>
    </div>
    <div class="breadcrumb" id="moleculaBreadcrumb" style="display:none"></div>
    <div style="margin-bottom:12px">
      <input type="search" id="moleculaSearch" placeholder="Buscar molécula (ej. eculizumab)..."
        style="width:100%;font:inherit;font-size:0.85rem;border:1px solid var(--border);border-radius:6px;padding:6px 10px;background:var(--surface-1);color:var(--text-primary)" />
    </div>
    <div class="chart-wrap" style="height:260px">
      <canvas id="moleculaChart"></canvas>
    </div>
    <table class="data-table" id="moleculaTable" style="display:none"></table>
  </figure>

  <figure class="chart-card">
    <div class="card-head">
      <div>
        <h2>Evolución mensual</h2>
        <p class="subtitle" id="monthSubtitle">Valor FOB y CIF importado por mes.</p>
      </div>
      <button class="table-toggle" data-toggle="month">Ver tabla</button>
    </div>
    <div class="chart-wrap" style="height:280px">
      <canvas id="monthChart"></canvas>
    </div>
    <table class="data-table" id="monthTable" style="display:none"></table>
  </figure>

  <div class="tabs" id="secondaryTabs">
    <button data-tab="tariff" class="active">Por partida arancelaria</button>
    <button data-tab="country">Por país de origen</button>
    <button data-tab="importer">Por importador</button>
  </div>

  <div class="tab-panel active" id="panel-tariff">
    <figure class="chart-card">
      <div class="card-head">
        <h2>Valor FOB por partida arancelaria</h2>
        <button class="table-toggle" data-toggle="tariff">Ver tabla</button>
      </div>
      <div class="chart-wrap" style="height:300px"><canvas id="tariffChart"></canvas></div>
      <table class="data-table" id="tariffTable" style="display:none"></table>
    </figure>
  </div>
  <div class="tab-panel" id="panel-country">
    <figure class="chart-card">
      <div class="card-head">
        <h2>Valor FOB por país de origen</h2>
        <button class="table-toggle" data-toggle="country">Ver tabla</button>
      </div>
      <div class="chart-wrap" style="height:300px"><canvas id="countryChart"></canvas></div>
      <table class="data-table" id="countryTable" style="display:none"></table>
    </figure>
  </div>
  <div class="tab-panel" id="panel-importer">
    <figure class="chart-card">
      <div class="card-head">
        <h2>Valor FOB por importador</h2>
        <button class="table-toggle" data-toggle="importer">Ver tabla</button>
      </div>
      <div class="chart-wrap" style="height:300px"><canvas id="importerChart"></canvas></div>
      <table class="data-table" id="importerTable" style="display:none"></table>
    </figure>
  </div>

</div>

<script src="/vendor/chart.js"></script>
<script src="/app.js"></script>
</body>
</html>
